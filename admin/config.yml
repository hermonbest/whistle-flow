backend:
  name: git-gateway
  branch: master

local_backend: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "settings"
    label: "Site Content & Design"
    files:
      - name: "site_config"
        label: "Branding, Styling & Sections"
        file: "content/site.json"
        fields:
          - { label: "Site Title", name: "title", widget: "string" }
          
          - label: "Theme & Brand Styling"
            name: "theme"
            widget: "object"
            fields:
              - { label: "Primary Accent Color", name: "primaryColor", widget: "color", default: "#6366f1" }
              - { label: "Background Color", name: "backgroundColor", widget: "color", default: "#0b0f19" }
              - { label: "Text Color", name: "textColor", widget: "color", default: "#f3f4f6" }
              - label: "Font Family"
                name: "fontFamily"
                widget: "select"
                options: ["Plus Jakarta Sans", "Inter", "Playfair Display", "Space Grotesk"]
                default: "Plus Jakarta Sans"

          - label: "Page Sections (Drag to Reorder or Add/Remove)"
            name: "sections"
            widget: "list"
            types:
              - label: "Hero Section"
                name: "hero"
                widget: "object"
                fields:
                  - { label: "Headline", name: "headline", widget: "string" }
                  - { label: "Subheadline", name: "subheadline", widget: "text" }
                  - { label: "Button Text", name: "buttonText", widget: "string" }
                  - { label: "Button Link", name: "buttonLink", widget: "string", default: "#features" }
              
              - label: "Features Grid"
                name: "features"
                widget: "object"
                fields:
                  - { label: "Section Title", name: "title", widget: "string" }
                  - label: "Feature Items"
                    name: "items"
                    widget: "list"
                    fields:
                      - { label: "Feature Title", name: "title", widget: "string" }
                      - { label: "Description", name: "description", widget: "text" }
              
              - label: "Call To Action Banner"
                name: "cta"
                widget: "object"
                fields:
                  - { label: "Heading", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Button Text", name: "buttonText", widget: "string" }
                  - { label: "Button Link", name: "buttonLink", widget: "string", default: "#" }
