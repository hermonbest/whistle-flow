<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Customizer — Admin Portal</title>
  <!-- Identity widget for production auth (Netlify Identity) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS Core Engine -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // 1. Load Google Fonts into the CMS preview iframe
    CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap");

    // 2. Custom CSS for the Live Preview Pane inside Decap
    CMS.registerPreviewStyle(`
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color, #0b0f19);
        color: var(--text-color, #f3f4f6);
        font-family: var(--font-family, 'Plus Jakarta Sans', sans-serif);
      }
      .preview-container {
        padding: 2rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 2.5rem;
        box-sizing: border-box;
      }
      .preview-hero {
        text-align: center;
        padding: 3rem 1rem;
        border-radius: 16px;
        background: rgba(255,255,255,0.02);
        border: 1px dashed rgba(255,255,255,0.1);
      }
      .preview-hero h1 {
        font-size: 2.2rem;
        margin-bottom: 0.75rem;
        line-height: 1.2;
      }
      .preview-hero p {
        opacity: 0.8;
        font-size: 1.05rem;
        margin-bottom: 1.5rem;
      }
      .preview-btn {
        display: inline-block;
        background: var(--primary-color, #6366f1);
        color: #fff;
        padding: 0.75rem 1.75rem;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }
      .preview-features {
        padding: 2rem 1rem;
      }
      .preview-features h2 {
        text-align: center;
        font-size: 1.75rem;
        margin-bottom: 1.5rem;
      }
      .preview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1.25rem;
      }
      .preview-card {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 1.25rem;
        border-radius: 12px;
      }
      .preview-cta {
        padding: 2.5rem 1.5rem;
        border-radius: 16px;
        text-align: center;
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(255,255,255,0.03));
        border: 1px solid rgba(99, 102, 241, 0.3);
      }
    `, { raw: true });

    // 3. Register the Live Interactive Preview Component
    const SitePreview = createClass({
      render: function() {
        const entry = this.props.entry;
        const data = entry.get('data') ? entry.get('data').toJS() : {};
        const theme = data.theme || {};
        const sections = Array.isArray(data.sections) ? data.sections : [];

        const primaryColor = theme.primaryColor || '#6366f1';
        const bgColor = theme.backgroundColor || '#0b0f19';
        const textColor = theme.textColor || '#f3f4f6';
        const fontFamily = theme.fontFamily || 'Plus Jakarta Sans';

        // Render sections dynamically in the exact order set by the client
        const renderedSections = sections.map((sec, idx) => {
          if (!sec) return null;
          if (sec.type === 'hero') {
            return h('div', { key: idx, className: 'preview-hero' },
              h('div', { style: { fontSize: '0.75rem', opacity: 0.5, marginBottom: '0.5rem', textTransform: 'uppercase', letterSpacing: '0.05em' } }, `[Section: Hero — Order #${idx + 1}]`),
              h('h1', null, sec.headline || 'Your Headline Here'),
              h('p', null, sec.subheadline || 'Your subheadline text goes here...'),
              sec.buttonText ? h('span', { className: 'preview-btn', style: { backgroundColor: primaryColor } }, sec.buttonText) : null
            );
          } else if (sec.type === 'features') {
            const items = Array.isArray(sec.items) ? sec.items : [];
            return h('div', { key: idx, className: 'preview-features' },
              h('div', { style: { textAlign: 'center', fontSize: '0.75rem', opacity: 0.5, marginBottom: '0.5rem', textTransform: 'uppercase', letterSpacing: '0.05em' } }, `[Section: Features Grid — Order #${idx + 1}]`),
              h('h2', null, sec.title || 'Features'),
              h('div', { className: 'preview-grid' },
                items.map((item, i) => h('div', { key: i, className: 'preview-card' },
                  h('h3', { style: { marginTop: 0, color: primaryColor } }, item.title || `Feature 0${i + 1}`),
                  h('p', { style: { marginBottom: 0, fontSize: '0.9rem', opacity: 0.8 } }, item.description || '')
                ))
              )
            );
          } else if (sec.type === 'cta') {
            return h('div', { key: idx, className: 'preview-cta', style: { borderColor: primaryColor } },
              h('div', { style: { fontSize: '0.75rem', opacity: 0.5, marginBottom: '0.5rem', textTransform: 'uppercase', letterSpacing: '0.05em' } }, `[Section: CTA Banner — Order #${idx + 1}]`),
              h('h2', { style: { marginTop: 0 } }, sec.title || 'Call to Action'),
              h('p', { style: { opacity: 0.85 } }, sec.description || ''),
              sec.buttonText ? h('span', { className: 'preview-btn', style: { backgroundColor: primaryColor } }, sec.buttonText) : null
            );
          }
          return null;
        });

        return h('div', {
          className: 'preview-container',
          style: {
            backgroundColor: bgColor,
            color: textColor,
            fontFamily: "'" + fontFamily + "', sans-serif",
            minHeight: '100vh',
            transition: 'all 0.2s ease'
          }
        },
          h('div', { style: { padding: '8px 14px', borderRadius: '8px', background: 'rgba(255,255,255,0.06)', fontSize: '12px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
            h('span', null, `👁️ Live Client Preview (${fontFamily} | Accent: ${primaryColor})`),
            h('span', { style: { opacity: 0.6 } }, `${sections.length} Sections Active`)
          ),
          renderedSections
        );
      }
    });

    // Register this template to the 'branding' file in 'settings' collection
    CMS.registerPreviewTemplate('site_config', SitePreview);
  </script>
</body>
</html>
